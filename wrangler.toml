name = "chatbot-thoi-trang"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Đồng bộ dữ liệu từ Google Sheets mỗi 15 phút
[triggers]
crons = ["*/15 * * * *"]

# Lịch sử chat của từng khách
# Tạo bằng: npx wrangler kv namespace create SHOP_KV  rồi dán id vào đây (chạy local thì để nguyên)
[[kv_namespaces]]
binding = "SHOP_KV"
id = "THAY_BANG_ID_KV"

# Bản sao danh mục sản phẩm + vector, để bot viết SQL tra cứu
# Tạo bằng: npx wrangler d1 create chatbot-thoi-trang  rồi dán database_id vào đây (chạy local thì để nguyên)
# Tạo bảng: npx wrangler d1 migrations apply chatbot-thoi-trang --local   (bỏ --local khi lên mạng)
[[d1_databases]]
binding = "DB"
database_name = "chatbot-thoi-trang"
database_id = "THAY_BANG_ID_D1"
migrations_dir = "migrations"

# Ảnh sản phẩm tự host (bản demo): public/anh/<ma_sp>.jpg, phục vụ ở /anh/<ma_sp>.jpg
[assets]
directory = "./public"
binding = "ASSETS"

# Tin nhắn Messenger đi qua hàng đợi để có tới 15 phút xử lý (waitUntil chỉ có 30 giây)
# Tạo bằng: npx wrangler queues create chatbot-tin-nhan   (chạy local thì không cần)
[[queues.producers]]
binding = "HANG_DOI"
queue = "chatbot-tin-nhan"

[[queues.consumers]]
queue = "chatbot-tin-nhan"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 0

[vars]
SHOP_NAME = "Mộc Lam Studio"
# Địa chỉ Worker sau khi deploy (VD https://chatbot-thoi-trang.<ten>.workers.dev), để gửi ảnh /anh/... qua Messenger
DIA_CHI_CONG_KHAI = ""
# Model suy nghĩ + gọi công cụ + xem ảnh. Mặc định: DeepSeek V4.1 Flash qua API kiểu OpenAI,
# khóa đặt ở OPENAI_API_KEY trong .dev.vars (lên mạng: npx wrangler secret put OPENAI_API_KEY).
# Muốn dùng Gemini thay thế: đặt LLM_NHA_CUNG_CAP = "gemini" (dùng GEMINI_MODEL, GEMINI_MODEL_DU_PHONG).
# Embedding luôn dùng Gemini (EMBED_MODEL), vì vector sản phẩm đã tạo bằng model đó.
LLM_NHA_CUNG_CAP = "openai"
OPENAI_BASE_URL = "https://api.deepseek.com/v1"
OPENAI_MODEL = "deepseek-flash"
# DeepSeek suy nghĩ ở vòng trò chuyện chính: "bat" (mặc định) hoặc "tat" (nhanh hơn nhưng tìm kém kỹ hơn, đo 15/10).
DEEPSEEK_SUY_NGHI = "bat"
GEMINI_MODEL = "gemini-3.8-flash"
GEMINI_MODEL_DU_PHONG = "gemini-3.5-flash-lite"
EMBED_MODEL = "gemini-embedding-2"
EMBED_DIM = "768"
# Link CSV của từng sheet (Google Sheets > Tệp > Chia sẻ > Công bố lên web > CSV)
SHEET_CSV_SANPHAM = ""
SHEET_CSV_BIENTHE = ""
SHEET_CSV_BANGSIZE = ""

# Bí mật: đặt bằng `npx wrangler secret put <TÊN>` (khi chạy local thì để trong .dev.vars)
# GEMINI_API_KEY, OPENAI_API_KEY, FB_PAGE_TOKEN, FB_VERIFY_TOKEN, FB_APP_SECRET, ADMIN_KEY
